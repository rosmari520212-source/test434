<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI Assistant (Customizable)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js for markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js for code formatting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .prose pre { background-color: #020617; border-radius: 0.5rem; padding: 0.75rem; margin-y: 0.5rem; overflow-x: auto; }
    .prose code { font-family: monospace; font-size: 0.875rem; }
    .prose p { margin-bottom: 0.5rem; line-height: 1.6; }
    .prose p:last-child { margin-bottom: 0; }
    .prose ul, .prose ol { margin-left: 1.25rem; margin-bottom: 0.5rem; list-style-type: disc; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur px-4 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-500 via-indigo-500 to-purple-500 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/20">
        ✨
      </div>
      <div>
        <h1 class="font-bold text-base md:text-lg leading-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">
          Gemini Assistant
        </h1>
        <p id="header-subtitle" class="text-xs text-slate-400">Free Tier Compatible • gemini-3.6-flash</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2">
      <button onclick="openSettingsModal()" class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition-colors flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span id="settings-button-label">Settings</span>
      </button>
      <button onclick="clearChat()" class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition-colors">
        Clear
      </button>
    </div>
  </header>

  <!-- Key Warning Bar if Key Missing -->
  <div id="api-key-banner" class="bg-amber-950/50 border-b border-amber-800/60 px-4 py-2 flex items-center justify-between text-xs text-amber-200">
    <div class="flex items-center space-x-2">
      <span>⚠️ No Gemini API Key detected. Please enter your key to start chatting.</span>
    </div>
    <button onclick="openSettingsModal()" class="underline font-bold hover:text-white">Settings</button>
  </div>

  <!-- Chat History Container -->
  <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-4xl mx-auto w-full">
    
    <!-- Welcome message -->
    <div id="welcome-msg" class="text-center py-12 space-y-4">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-500 to-purple-600 mx-auto flex items-center justify-center text-3xl shadow-xl shadow-blue-500/20">
        🤖
      </div>
      <h2 class="text-2xl font-bold text-slate-100">Ready for your prompts</h2>
      <p class="text-slate-400 text-sm max-w-md mx-auto">
        Connected directly to Google AI Studio. Use the settings menu to change how I respond!
      </p>
    </div>

  </main>

  <!-- Input Footer -->
  <footer class="border-t border-slate-800 bg-slate-900/50 p-4 shrink-0">
    <div class="max-w-4xl mx-auto">
      <form id="chat-form" onsubmit="handleSend(event)" class="relative flex items-center">
        <textarea 
          id="user-input" 
          rows="1"
          placeholder="Ask Gemini anything..." 
          class="w-full bg-slate-950 border border-slate-800 focus:border-blue-500 rounded-xl py-3 pl-4 pr-12 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-blue-500 resize-none transition-all"
          onkeydown="handleKeyDown(event)"
        ></textarea>
        <button 
          type="submit" 
          id="send-btn"
          class="absolute right-2 p-2 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-400 hover:to-purple-500 text-white rounded-lg transition-all disabled:opacity-40 disabled:cursor-not-allowed"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
        </button>
      </form>
    </div>
  </footer>

  <!-- Combined Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-slate-100 text-base">⚙️ Assistant Settings</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-200 text-sm">✕</button>
      </div>
      
      <!-- API Key -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">API Key</label>
        <input type="password" id="api-key-input" placeholder="Your Google AI Studio Key..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500 font-mono">
      </div>

      <!-- Model Choice -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">AI Model Version</label>
        <select id="model-select" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
          <option value="gemini-3.6-flash">gemini-3.6-flash (Custom)</option>
          <option value="gemini-2.5-flash">gemini-2.5-flash (Legacy)</option>
          <option value="gemini-1.5-flash">gemini-1.5-flash (Standard Fast)</option>
          <option value="gemini-1.5-pro">gemini-1.5-pro (Advanced Reasoning)</option>
        </select>
      </div>

      <!-- System Instructions -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Custom Instructions (How I should act)</label>
        <textarea id="system-prompt-input" rows="2" placeholder="e.g. You are a coding expert. Only reply with working HTML." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500 resize-none"></textarea>
      </div>

      <div class="flex justify-end gap-2 pt-3 border-t border-slate-800 mt-2">
        <button onclick="saveSettings()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs rounded-xl transition-all">Save Choices</button>
      </div>
    </div>
  </div>

  <script>
    let conversationHistory = [];

    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const welcomeMsg = document.getElementById('welcome-msg');
    const sendBtn = document.getElementById('send-btn');
    const keyBanner = document.getElementById('api-key-banner');
    
    // Settings Elements
    const settingsModal = document.getElementById('settings-modal');
    const apiKeyInput = document.getElementById('api-key-input');
    const modelSelect = document.getElementById('model-select');
    const systemPromptInput = document.getElementById('system-prompt-input');
    const headerSubtitle = document.getElementById('header-subtitle');

    window.onload = () => {
      // Load saved settings
      const savedKey = localStorage.getItem('gemini_free_api_key');
      const savedModel = localStorage.getItem('gemini_model_choice') || 'gemini-3.6-flash';
      const savedPrompt = localStorage.getItem('gemini_system_prompt') || '';

      if (savedKey) {
        apiKeyInput.value = savedKey;
        keyBanner.classList.add('hidden');
      }
      
      modelSelect.value = savedModel;
      systemPromptInput.value = savedPrompt;
      headerSubtitle.innerText = `Free Tier Compatible • ${savedModel}`;
    };

    function openSettingsModal() { settingsModal.classList.remove('hidden'); }
    function closeSettingsModal() { settingsModal.classList.add('hidden'); }

    function saveSettings() {
      const key = apiKeyInput.value.trim();
      const model = modelSelect.value;
      const prompt = systemPromptInput.value.trim();

      if (key) {
        localStorage.setItem('gemini_free_api_key', key);
        keyBanner.classList.add('hidden');
      } else {
        localStorage.removeItem('gemini_free_api_key');
        keyBanner.classList.remove('hidden');
      }

      localStorage.setItem('gemini_model_choice', model);
      localStorage.setItem('gemini_system_prompt', prompt);
      
      headerSubtitle.innerText = `Free Tier Compatible • ${model}`;
      closeSettingsModal();
    }

    userInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        handleSend(event);
      }
    }

    function clearChat() {
      conversationHistory = [];
      chatContainer.innerHTML = '';
      chatContainer.appendChild(welcomeMsg);
      welcomeMsg.classList.remove('hidden');
    }

    function appendMessage(role, text) {
      welcomeMsg.classList.add('hidden');
      const msgWrapper = document.createElement('div');
      msgWrapper.className = `flex gap-3 ${role === 'user' ? 'justify-end' : 'justify-start'}`;

      const isUser = role === 'user';
      const avatar = isUser
        ? `<div class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-xs shrink-0 font-semibold text-slate-300">You</div>`
        : `<div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-500 to-purple-600 flex items-center justify-center text-xs shrink-0 font-bold text-white shadow-md">✨</div>`;

      const contentBg = isUser
        ? 'bg-blue-600 text-white rounded-2xl rounded-tr-none px-4 py-3 max-w-[85%] text-sm shadow-md'
        : 'bg-slate-900 border border-slate-800 text-slate-100 rounded-2xl rounded-tl-none px-4 py-3 max-w-[90%] md:max-w-[85%] text-sm prose prose-invert';

      const formattedContent = isUser ? text : marked.parse(text);

      msgWrapper.innerHTML = isUser 
        ? `<div class="${contentBg}">${formattedContent}</div>${avatar}`
        : `${avatar}<div class="${contentBg}">${formattedContent}</div>`;

      chatContainer.appendChild(msgWrapper);

      if (!isUser) {
        msgWrapper.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightElement(block);
        });
      }

      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgWrapper;
    }

    function appendLoadingIndicator() {
      const loaderWrapper = document.createElement('div');
      loaderWrapper.id = 'loading-indicator';
      loaderWrapper.className = 'flex gap-3 justify-start items-center';
      loaderWrapper.innerHTML = `
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-500 to-purple-600 flex items-center justify-center text-xs shrink-0 font-bold text-white">✨</div>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl rounded-tl-none px-4 py-3 flex items-center gap-1.5">
          <div class="w-2 h-2 rounded-full bg-blue-400 animate-bounce"></div>
          <div class="w-2 h-2 rounded-full bg-indigo-400 animate-bounce [animation-delay:0.2s]"></div>
          <div class="w-2 h-2 rounded-full bg-purple-400 animate-bounce [animation-delay:0.4s]"></div>
        </div>
      `;
      chatContainer.appendChild(loaderWrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeLoadingIndicator() {
      const loader = document.getElementById('loading-indicator');
      if (loader) loader.remove();
    }

    async function handleSend(e) {
      e.preventDefault();
      const apiKey = localStorage.getItem('gemini_free_api_key');
      const selectedModel = localStorage.getItem('gemini_model_choice') || 'gemini-3.6-flash';
      const customPrompt = localStorage.getItem('gemini_system_prompt') || '';

      if (!apiKey) {
        openSettingsModal();
        return;
      }

      const text = userInput.value.trim();
      if (!text) return;

      userInput.value = '';
      userInput.style.height = 'auto';
      sendBtn.disabled = true;

      appendMessage('user', text);

      conversationHistory.push({
        role: "user",
        parts: [{ text: text }]
      });

      appendLoadingIndicator();

      // Dynamically use the model you selected in the settings menu
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent`;

      // Build the request payload, adding custom instructions if you typed any
      const requestPayload = { contents: conversationHistory };
      if (customPrompt) {
        requestPayload.system_instruction = {
          parts: [{ text: customPrompt }]
        };
      }

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'x-goog-api-key': apiKey 
          },
          body: JSON.stringify(requestPayload)
        });

        const data = await response.json();
        removeLoadingIndicator();

        if (!response.ok) {
          const errMsg = data.error?.message || JSON.stringify(data.error) || `HTTP Error ${response.status}`;
          appendMessage('model', `❌ **API Error:** ${errMsg}`);
          conversationHistory.pop();
          return;
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;

        if (reply) {
          appendMessage('model', reply);
          conversationHistory.push({
            role: "model",
            parts: [{ text: reply }]
          });
        } else {
          appendMessage('model', '⚠️ *Received empty response.*');
        }

      } catch (err) {
        removeLoadingIndicator();
        appendMessage('model', `❌ **Network Error:** ${err.message}`);
        conversationHistory.pop();
      } finally {
       
        
          sendBtn.disabled = false;
    
        } 
        
    }
  </script>
</body>
</html>
